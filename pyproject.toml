[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "handoverguard"
version = "0.1.0"
description = "A policy-bound hotel shift-handover agent built with Strands Agents."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Redwan Rahman" }]
dependencies = [
  "botocore[crt]>=1.43,<2",
  "fastapi>=0.116,<1",
  "pydantic>=2.11,<3",
  "strands-agents==1.53.0",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
handoverguard = "handoverguard.api:main"

[tool.hatch.build.targets.wheel]
packages = ["src/handoverguard"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["handoverguard"]
