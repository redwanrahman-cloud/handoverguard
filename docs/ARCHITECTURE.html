<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HandoverGuard architecture</title>
<style>
  :root { color-scheme:light dark; --bg:#f8fafc; --fg:#172033; --muted:#5b6475; --line:#64748b; --neutral:#e2e8f0; --input:#bfdbfe; --process:#c7d2fe; --storage:#99f6e4; --external:#fde68a; --risk:#fecaca; }
  @media (prefers-color-scheme:dark) { :root { --bg:#0f172a; --fg:#e5e7eb; --muted:#a3adbd; --line:#94a3b8; --neutral:#334155; --input:#1d4ed8; --process:#4338ca; --storage:#0f766e; --external:#92400e; --risk:#991b1b; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  main { max-width:1180px; margin:28px auto; padding:0 20px; } svg { width:100%; height:auto; display:block; }
  .title { font-size:25px; font-weight:700; fill:var(--fg); } .subtitle,.small { font-size:12px; fill:var(--muted); }
  .zone-title { font-size:11px; font-weight:700; letter-spacing:1px; fill:var(--muted); } .label { font-size:14px; font-weight:700; fill:var(--fg); }
  .node { stroke:var(--line); stroke-width:1; } .neutral { fill:var(--neutral); } .input { fill:var(--input); } .process { fill:var(--process); } .storage { fill:var(--storage); } .external { fill:var(--external); } .risk { fill:var(--risk); }
  .edge { stroke:var(--line); stroke-width:2; fill:none; marker-end:url(#arrow); } .blocked { stroke:#ef4444; stroke-width:2; stroke-dasharray:7 5; fill:none; marker-end:url(#block-arrow); }
  .zone { fill:none; stroke:var(--line); stroke-width:1; stroke-dasharray:7 6; opacity:.8; }
</style>
<main>
  <svg viewBox="0 0 1180 720" role="img" aria-labelledby="diagram-title diagram-desc">
    <title id="diagram-title">HandoverGuard policy-bound agent architecture</title>
    <desc id="diagram-desc">Synthetic hotel notes enter FastAPI. A Strands agent using Amazon Nova calls narrow tools. Deterministic server policy creates internal tasks or human approvals. SQLite persists state and a hash-chain audit. External actions remain blocked.</desc>
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="var(--line)" /></marker>
      <marker id="block-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ef4444" /></marker>
    </defs>
    <text x="30" y="38" class="title">HandoverGuard · Policy-bound hotel operations agent</text>
    <text x="30" y="62" class="subtitle">Probabilistic interpretation is separated from deterministic authority and evidence.</text>
    <rect x="215" y="92" width="720" height="545" rx="18" class="zone" /><text x="235" y="118" class="zone-title">HANDOVERGUARD TRUST ZONE</text>
    <rect x="960" y="92" width="190" height="545" rx="18" class="zone" /><text x="980" y="118" class="zone-title">OUTSIDE BOUNDARY</text>
    <path d="M185 210 H260" class="edge" /><path d="M430 210 H500" class="edge" /><path d="M675 210 H745" class="edge" />
    <path d="M830 270 V330" class="edge" /><path d="M745 402 H675" class="edge" /><path d="M585 470 V530" class="edge" />
    <path d="M500 402 H430" class="edge" /><path d="M345 470 V530" class="edge" /><path d="M430 575 H500" class="edge" />
    <path d="M675 575 H745" class="edge" /><path d="M915 575 H995" class="blocked" />
    <rect x="30" y="155" width="155" height="110" rx="14" class="node input" /><text x="52" y="190" class="label">Shift notes</text><text x="52" y="215" class="small">Maintenance</text><text x="52" y="234" class="small">Guest · Safety · Pay</text>
    <rect x="260" y="155" width="170" height="110" rx="14" class="node neutral" /><text x="284" y="190" class="label">FastAPI boundary</text><text x="284" y="215" class="small">Typed validation</text><text x="284" y="234" class="small">Synthetic-only demo</text>
    <rect x="500" y="155" width="175" height="110" rx="14" class="node process" /><text x="524" y="190" class="label">Strands Agent</text><text x="524" y="215" class="small">Complete-shift tool</text><text x="524" y="234" class="small">Idempotent execution</text>
    <rect x="745" y="155" width="170" height="110" rx="14" class="node external" /><text x="769" y="190" class="label">Amazon Bedrock</text><text x="769" y="215" class="small">Amazon Nova Lite</text><text x="769" y="234" class="small">Interpretation only</text>
    <rect x="745" y="330" width="170" height="140" rx="14" class="node risk" /><text x="769" y="365" class="label">Server policy gate</text><text x="769" y="392" class="small">Safety · Compensation</text><text x="769" y="411" class="small">Payment · Guest contact</text><text x="769" y="438" class="small">Model cannot bypass</text>
    <rect x="500" y="330" width="175" height="140" rx="14" class="node process" /><text x="524" y="365" class="label">Workflow service</text><text x="524" y="392" class="small">Deduplicate notes</text><text x="524" y="411" class="small">Assign owners + SLAs</text><text x="524" y="430" class="small">Enforce state machine</text>
    <rect x="260" y="330" width="170" height="140" rx="14" class="node storage" /><text x="284" y="365" class="label">SQLite state</text><text x="284" y="392" class="small">Issues · Tasks</text><text x="284" y="411" class="small">Approval decisions</text><text x="284" y="430" class="small">SHA-256 audit chain</text>
    <rect x="260" y="530" width="170" height="90" rx="14" class="node neutral" /><text x="284" y="565" class="label">Evidence packet</text><text x="284" y="590" class="small">Digest-bearing JSON</text>
    <rect x="500" y="530" width="175" height="90" rx="14" class="node input" /><text x="524" y="565" class="label">Operator dashboard</text><text x="524" y="590" class="small">Approve · Reject · Inspect</text>
    <rect x="745" y="530" width="170" height="90" rx="14" class="node process" /><text x="769" y="565" class="label">Owned follow-up</text><text x="769" y="590" class="small">Internal task only</text>
    <rect x="995" y="530" width="130" height="90" rx="14" class="node risk" /><text x="1019" y="565" class="label">External action</text><text x="1019" y="590" class="small">Blocked in demo</text>
    <text x="30" y="685" class="small">Red dashed edge: explicit boundary. Approval creates accountable internal work; it never silently contacts a guest, moves money, or closes an incident.</text>
  </svg>
</main>
