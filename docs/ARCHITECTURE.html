<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HandoverGuard AWS-native architecture</title>
<style>
  :root{color-scheme:dark;--bg:#08111f;--fg:#f8fafc;--muted:#a9b5c8;--blue:#123b69;--purple:#382c70;--teal:#075f5b;--orange:#864009;--red:#7f1d1d}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 Inter,ui-sans-serif,system-ui,sans-serif}main{max-width:1400px;margin:24px auto;padding:0 18px}svg{width:100%;height:auto;display:block}.title{font-size:27px;font-weight:800;fill:var(--fg)}.sub{font-size:13px;fill:var(--muted)}.zone{fill:none;stroke:#48627e;stroke-width:1;stroke-dasharray:7 6}.zt{font-size:11px;font-weight:800;letter-spacing:1.2px;fill:#9fb2c9}.node{stroke:#89a0ba;stroke-width:1}.input{fill:var(--blue)}.ai{fill:var(--purple)}.store{fill:var(--teal)}.approval{fill:var(--orange)}.blocked{fill:var(--red)}.label{font-size:14px;font-weight:800;fill:#fff}.small{font-size:11.5px;fill:#d2dbea}.edge{stroke:#8ca2bb;stroke-width:2;fill:none;marker-end:url(#a)}.event{stroke:#5eead4}.deny{stroke:#fb7185;stroke-dasharray:7 5;marker-end:url(#r)}
</style>
<main><svg viewBox="0 0 1360 780" role="img" aria-labelledby="title desc">
  <title id="title">HandoverGuard AWS-native execution architecture</title>
  <desc id="desc">A public judge console submits synthetic handovers through managed AWS ingestion. AgentCore Runtime applies Bedrock Guardrails, invokes Nova with Strands, then calls narrow AgentCore Gateway tools. Lambda policy creates DynamoDB tasks or Step Functions human approvals while S3 and CloudWatch retain evidence. No external hotel action exists.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#8ca2bb"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#fb7185"/></marker></defs>
  <text x="28" y="36" class="title">HandoverGuard · AWS-native policy-bound agent</text>
  <text x="28" y="60" class="sub">The judge sees every managed hop: input, model latency, Gateway tool calls, authority decisions, approval waits, and evidence.</text>
  <rect x="20" y="90" width="1320" height="180" rx="18" class="zone"/><text x="40" y="116" class="zt">1 · MANAGED INGESTION</text>
  <rect x="45" y="145" width="170" height="88" rx="13" class="node input"/><text x="65" y="178" class="label">CloudFront console</text><text x="65" y="202" class="small">Public synthetic demo</text>
  <rect x="275" y="145" width="170" height="88" rx="13" class="node input"/><text x="295" y="178" class="label">API Gateway</text><text x="295" y="202" class="small">Validation · run ID</text>
  <rect x="505" y="145" width="170" height="88" rx="13" class="node store"/><text x="525" y="178" class="label">Amazon S3</text><text x="525" y="202" class="small">Versioned raw input</text>
  <rect x="735" y="145" width="170" height="88" rx="13" class="node input"/><text x="755" y="178" class="label">EventBridge</text><text x="755" y="202" class="small">Object-created event</text>
  <rect x="965" y="145" width="170" height="88" rx="13" class="node input"/><text x="985" y="178" class="label">Amazon SQS</text><text x="985" y="202" class="small">Retry + dead-letter queue</text>
  <rect x="1195" y="145" width="120" height="88" rx="13" class="node ai"/><text x="1213" y="178" class="label">Dispatcher</text><text x="1213" y="202" class="small">Invoke runtime</text>
  <path d="M215 189H275M445 189H505M675 189H735M905 189H965M1135 189H1195" class="edge event"/>
  <rect x="20" y="295" width="1320" height="205" rx="18" class="zone"/><text x="40" y="321" class="zt">2 · AGENT INTELLIGENCE — PROBABILISTIC INTERPRETATION, NO AUTHORITY</text>
  <rect x="95" y="360" width="210" height="96" rx="13" class="node ai"/><text x="118" y="393" class="label">AgentCore Runtime</text><text x="118" y="417" class="small">ARM64 Python · managed host</text><text x="118" y="436" class="small">Coordinates complete shift</text>
  <rect x="380" y="360" width="210" height="96" rx="13" class="node ai"/><text x="403" y="393" class="label">Bedrock Guardrails</text><text x="403" y="417" class="small">Input inspection · PII filter</text><text x="403" y="436" class="small">Prompt-injection boundary</text>
  <rect x="665" y="360" width="210" height="96" rx="13" class="node ai"/><text x="688" y="393" class="label">Nova Lite + Strands</text><text x="688" y="417" class="small">Bilingual structured extraction</text><text x="688" y="436" class="small">Canonical incident keys</text>
  <rect x="950" y="360" width="300" height="96" rx="13" class="node ai"/><text x="973" y="393" class="label">AgentCore Gateway · MCP</text><text x="973" y="417" class="small">record_trace · route_issue · write_evidence</text><text x="973" y="436" class="small">No send · charge · refund · resolve tools</text>
  <path d="M1200 233V285H200V360M305 408H380M590 408H665M875 408H950" class="edge"/>
  <rect x="20" y="525" width="1320" height="205" rx="18" class="zone"/><text x="40" y="551" class="zt">3 · DETERMINISTIC AUTHORITY, HUMAN CONTROL, AND EVIDENCE</text>
  <rect x="55" y="585" width="190" height="96" rx="13" class="node approval"/><text x="78" y="618" class="label">Lambda policy gate</text><text x="78" y="642" class="small">Safety · payment · contact</text><text x="78" y="661" class="small">Model cannot bypass</text>
  <rect x="300" y="585" width="185" height="96" rx="13" class="node store"/><text x="323" y="618" class="label">DynamoDB</text><text x="323" y="642" class="small">Idempotent run state</text><text x="323" y="661" class="small">PITR · tasks · decisions</text>
  <rect x="540" y="585" width="210" height="96" rx="13" class="node approval"/><text x="563" y="618" class="label">Step Functions + SNS</text><text x="563" y="642" class="small">Callback-token human wait</text><text x="563" y="661" class="small">Approve or reject</text>
  <rect x="805" y="585" width="190" height="96" rx="13" class="node store"/><text x="828" y="618" class="label">S3 evidence</text><text x="828" y="642" class="small">SHA-256 canonical packet</text><text x="828" y="661" class="small">30-day lifecycle</text>
  <rect x="1050" y="585" width="150" height="96" rx="13" class="node input"/><text x="1073" y="618" class="label">CloudWatch</text><text x="1073" y="642" class="small">Logs · metrics</text><text x="1073" y="661" class="small">X-Ray traces</text>
  <rect x="1240" y="585" width="80" height="96" rx="13" class="node blocked"/><text x="1252" y="618" class="label">Hotel</text><text x="1252" y="642" class="small">external</text><text x="1252" y="661" class="small">BLOCKED</text>
  <path d="M1100 456V520H150V585M245 633H300M485 633H540M750 633H805M995 633H1050" class="edge"/>
  <path d="M645 681V712H1280V681" class="edge deny"/>
  <text x="28" y="762" class="sub">Human approval resumes accountable internal workflow only. The competition deployment has zero PMS, payment, messaging, or guest-contact side effects.</text>
</svg></main>
